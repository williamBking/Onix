<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Onix Finance — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=DM+Sans:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --red:#C0392B;--dark:#1A1A1A;--bg:#F8F7F5;
  --border:#E8E8E8;--muted:#6B6560;--light:#9B9590;
  --red-light:#FDF0EE;--success:#3B8B3B;--success-bg:#EBF5EB;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--dark);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
a,button{cursor:pointer;text-decoration:none;background:none;border:none;font-family:inherit;color:inherit}
.card{background:#fff;border:1px solid var(--border);border-top:3px solid var(--red);padding:40px 44px;max-width:460px;width:100%}
.eyebrow{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--red);font-weight:600;margin-bottom:14px}
.title{font-family:var(--serif);font-style:italic;font-weight:500;font-size:2.2rem;line-height:1;margin-bottom:10px;letter-spacing:-.01em}
.sub{color:var(--light);font-size:.92rem;margin-bottom:30px;line-height:1.6}
.field-label{display:block;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.field-input{width:100%;padding:13px 14px;border:1px solid var(--border);background:#fff;font-size:.9rem;font-family:inherit;color:var(--dark);outline:none;border-radius:2px}
.field-input:focus{border-color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:2px;border:1px solid var(--red);background:var(--red);color:#fff;width:100%;margin-top:18px}
.btn:hover{background:#a93226}
.err{display:none;color:var(--red);font-size:.85rem;padding:12px 14px;background:var(--red-light);border-left:3px solid var(--red);margin-bottom:18px}
.err.show{display:block}
.ok{display:none;color:var(--success);font-size:.95rem;padding:18px 20px;background:var(--success-bg);border-left:3px solid var(--success);line-height:1.55}
.ok.show{display:block}
.back{font-size:.82rem;color:var(--light);text-align:center;margin-top:20px}
.back a{color:var(--red);font-weight:500}
</style>
</head>
<body>
<div class="card">
  <p class="eyebrow">Account Recovery</p>
  <h1 class="title">Set a new password</h1>
  <p class="sub" id="sub-text">Enter your new password below.</p>

  <div id="err" class="err"></div>
  <div id="ok" class="ok">
    <strong style="display:block;font-size:1.05rem;font-family:var(--serif);font-style:italic;margin-bottom:6px">Password updated.</strong>
    Your password has been changed.
    <div style="margin-top:14px"><a href="login.html" style="color:var(--red);font-weight:600">→ Sign in</a></div>
  </div>

  <form id="form" onsubmit="doReset(event)">
    <label class="field-label">New Password</label>
    <input id="pw" type="password" class="field-input" minlength="8" placeholder="At least 8 characters" style="margin-bottom:18px" required>
    <label class="field-label">Confirm Password</label>
    <input id="pw2" type="password" class="field-input" minlength="8" placeholder="••••••••" required>
    <button type="submit" class="btn"><span id="btn-text">Update Password</span></button>
  </form>

  <div class="back">Remembered it? <a href="login.html">Back to sign in</a></div>
</div>

<script>
const SUPABASE_URL = 'https://ckayfqplkpplgojdhjlu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrYXlmcXBsa3BwbGdvamRoamx1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTUzNDUsImV4cCI6MjA5MzY3MTM0NX0.E5lmNud0ERUqaxy829d1dB3AqGw9EEFjHFSB7zDJdFE';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const errEl = document.getElementById('err');
const okEl  = document.getElementById('ok');
const form  = document.getElementById('form');
const subT  = document.getElementById('sub-text');
const btnT  = document.getElementById('btn-text');

// Supabase delivers the recovery session via URL hash. Listen for it.
_supabase.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') {
    subT.textContent = 'Enter a new password for your account.';
  }
});

// Fallback: if the URL doesn't have a recovery token, warn the user.
(async () => {
  const { data } = await _supabase.auth.getSession();
  if (!data.session && !window.location.hash.includes('access_token')) {
    errEl.textContent = 'No active recovery session. Please request a new reset email from the sign-in page.';
    errEl.classList.add('show');
    form.style.display = 'none';
  }
})();

async function doReset(e) {
  e.preventDefault();
  errEl.classList.remove('show');
  const pw = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;
  if (pw !== pw2) {
    errEl.textContent = 'Passwords do not match.';
    errEl.classList.add('show');
    return;
  }
  btnT.textContent = 'Updating…';
  const { error } = await _supabase.auth.updateUser({ password: pw });
  if (error) {
    errEl.textContent = error.message || 'Could not update password.';
    errEl.classList.add('show');
    btnT.textContent = 'Update Password';
    return;
  }
  // Sign out so the user has to log in fresh with the new password.
  await _supabase.auth.signOut();
  form.style.display = 'none';
  okEl.classList.add('show');
}
</script>
</body>
</html>
